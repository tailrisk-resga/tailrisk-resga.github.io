[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "es_prediction"
version = "0.1.0"
description = "Reproducible code for expected shortfall prediction experiments."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Expected Shortfall Prediction Authors"}
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "torch",
  "tqdm",
  "joblib",
  "matplotlib",
  "seaborn",
  "python-dateutil",
  "einops",
  "PyYAML",
]

[project.optional-dependencies]
baselines = ["rpy2", "numba"]
logging = ["wandb"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py39"
